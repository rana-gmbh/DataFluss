name: CLA

# Pull requests from outside need the Contributor Licence Agreement (CLA.md). Contributors sign with a
# comment; the signatures are kept in the branch cla-signatures of this repository.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/rana-gmbh/DataFluss/blob/main/CLA.md
          branch: cla-signatures
          allowlist: rana-gmbh,dependabot[bot]
