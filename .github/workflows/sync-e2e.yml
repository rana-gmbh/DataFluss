name: Sync end to end

# A real server and four real clients, each its own process and SQLite database (tests/sync_e2e/run.py).
# Too slow for every push: nightly and by hand.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  sync-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install --require-hashes -r requirements.lock
      - run: python tests/sync_e2e/run.py
