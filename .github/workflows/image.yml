name: Server image

# A tag v<version> builds the server image and pushes ghcr.io/rana-gmbh/datafluss:<version> and :latest.
# Servers update with it before the apps' update feeds are promoted (docs/releases.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          version=$(cat VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: SOURCE_COMMIT=${{ github.sha }}
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ghcr.io/rana-gmbh/datafluss:${{ steps.version.outputs.version }}
            ghcr.io/rana-gmbh/datafluss:latest
          labels: |
            org.opencontainers.image.source=https://github.com/rana-gmbh/DataFluss
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
