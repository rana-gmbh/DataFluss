{% load i18n ui %}
<span x-data="{ show: true }" x-init="setTimeout(() => show = false, 30000)" class="inline-flex items-center gap-1.5">
  <span x-show="show"><span class="mono select-all" id="{{ dom_id }}">{{ value }}</span>
    <button type="button" class="btn btn-ghost btn-sm btn-icon" data-copy="{{ dom_id }}" aria-label="{% translate 'Kopieren' %}">{% icon 'copy' %}</button></span>
  <span x-show="!show" x-cloak class="mono muted">••••••••</span>
</span>
