{% load i18n static %}<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'de' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{ title }}</title>
<link rel="stylesheet" href="{% static 'css/app.css' %}">
<script src="{% static 'js/theme.js' %}"></script>
</head>
<body class="min-h-screen grid place-items-center p-4">
<main class="w-full max-w-sm">
  <h1 class="page-title text-center mb-1">{{ title }}</h1>
  <p class="muted text-[13px] text-center mb-4">{% translate "Diese Website ist mit einem Passwort geschützt." %}</p>
  <form method="post" class="surface p-5 space-y-3">{% csrf_token %}
    <div><label class="label" for="site-password">{% translate "Passwort" %}</label>
      <input id="site-password" class="input" type="password" name="password" autocomplete="current-password" required autofocus></div>
    {% if error %}<p class="text-[13px] text-[var(--bad)]" role="alert">{{ error }}</p>{% endif %}
    <button class="btn btn-primary w-full">{% translate "Öffnen" %}</button>
  </form>
</main>
</body>
</html>
